services:
  django:
    container_name: django
    build:
      context: .
      dockerfile: Dockerfile-prod
    restart: always
    volumes:
      - static-data:/vol/web
    env_file:
      - ./.env
    environment:
      - DJANGO=true
    depends_on:
      - db

  cron:
    container_name: cron
    build:
      context: .
      dockerfile: Dockerfile-prod

    env_file:
      - ./.env
    environment:
      - CRON=true
    depends_on:
    - db
    user: bs_draft_app
    command: crond -f -l 2  # Keeps the container running

  db:
    image: postgres:15.7-alpine
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}

  proxy:
    container_name: proxy
    build:
      context: ./proxy
      args:
        ENV: ${ENV}  #these are needed during buildingz
        
    restart: always
    depends_on:
      - django
      - certbot
    env_file:
      - ./.env
    ports:
      - 80:80
      - 443:443
    volumes:
      - static-data:/vol/static
      - ./data/letsencrypt:/etc/letsencrypt  # SSL certificates
  certbot:
    image: certbot/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw


volumes:
  postgres-data:
  static-data: