services:
  django:
    container_name: django
    build:
      context: .
      dockerfile: Dockerfile-prod
    restart: always
    volumes:
      - static-data:/vol/web
    env_file:
      - ./.env
    environment:
      - DJANGO=true
    depends_on:
      - db

  cron:
    container_name: cron
    build:
      context: .
      dockerfile: Dockerfile-prod

    env_file:
      - ./.env
    environment:
      - CRON=true
    depends_on:
    - db
    user: bs_draft_app
    command: crond -f -l 2  # Keeps the container running

  db:
    image: postgres:15.7-alpine
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}

  proxy:
    build:
      context: ./proxy
    restart: always
    depends_on:
      - django
    ports:
      - 80:8000
    volumes:
      - static-data:/vol/static

volumes:
  postgres-data:
  static-data: