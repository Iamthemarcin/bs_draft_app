version : '3.8'

services:
  django:
    container_name : django
    build: 
      context: .
      dockerfile: Dockerfile-dev
    volumes:
      - "./bs_draft_app:/bs_draft_app"
    restart: unless-stopped
    ports:
      - 8001:8000
      - 3000:3000

    env_file:
      - ./.env.dev
    depends_on:
      - db
    command: python3 manage.py runserver 0.0.0.0:8000
    user: root #for the dev container connection
  db:
    container_name: postgres
    image: postgres:15.7-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=marcin
      - POSTGRES_PASSWORD=otyhaker
      - POSTGRES_DB=power_draft
      
  cron:
    container_name: cron
    build: 
      context: .
      dockerfile: Dockerfile-dev
    env_file:
    - .env.dev
    environment:
      - CRON=true
    depends_on:
    - db
    command:  crond -f -l 2 # Keeps the container running

volumes:
  postgres-data:
